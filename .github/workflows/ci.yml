# Checks every push and pull request. Netlify builds and deploys separately.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check and build (preview mode)
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Database security tests (migrations + RLS)
        run: npm run test:db
      - name: End-to-end tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
