<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Academy Plan Responses</title>
<link rel="stylesheet" href="plan.css">
</head>
<body>
<header class="cover"><div class="wrap">
  <p class="brand"><b>The</b> Endowed Academy</p>
  <h1>Planning form responses</h1>
  <p>Private. Only the email set in Supabase can see these answers.</p>
</div></header>

<main><div class="wrap">
  <form class="login" id="login" novalidate>
    <h2>Sign in</h2>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required>
    </div>
    <p class="err" id="login-err" role="alert"></p>
    <button class="btn purple" type="submit" id="login-btn">Sign in</button>
  </form>

  <div id="app" hidden>
    <div class="toolbar">
      <p id="summary-line">Loading…</p>
      <div class="btns">
        <button class="btn line" type="button" id="reload">Refresh</button>
        <button class="btn line" type="button" id="logout">Sign out</button>
      </div>
    </div>
    <div class="subs" id="subs" role="group" aria-label="Submissions"></div>
    <div class="toolbar" id="detail-bar" hidden>
      <p id="detail-meta"></p>
      <div class="btns">
        <button class="btn purple" type="button" id="copy-one">Copy as text</button>
      </div>
    </div>
    <p class="err" id="app-msg" role="status"></p>
    <div class="detail" id="detail"></div>
  </div>
</div></main>

<script src="config.js"></script>
<script src="responses.js"></script>
</body>
</html>
